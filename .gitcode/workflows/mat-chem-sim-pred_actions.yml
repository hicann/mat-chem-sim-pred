name: PR-pipeline_mat-chem-sim-pred

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

# 删除任何一个都可能导致评论 /compile 无法触发流水线，请勿单独删除。
on:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name }}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ vars.OBS_PATH }}/${{ env.MERGE_ID }}"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              allow-unsafe-pr-checkout: true
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
      - type: auto
    fail-fast: true

  stage2:
    name: CodeCheck
    jobs:
      JOB_codecheck:
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
    pre:
      - type: auto
    fail-fast: false

  stage3:
    name: ReferenceTest
    jobs:
      # Python 算子测试（build.sh 统一入口）
      JOB_pytorch:
        name: PyTorch_Reference_Tests
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Run_GPR_tests
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/build.sh \
                --python prediction/SmallData \
                -f pr_filelist.txt
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_prediction_reference:
        name: Prediction_Reference_Tests
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Run_reference_tests
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/build.sh \
                --reference-test prediction/ProcessControl/ \
                -f pr_filelist.txt \
                --common-dirs="prediction/ProcessControl/PIDModelFit/common/ prediction/ProcessControl/TimeSeriesForecast/common/ prediction/ProcessControl/NonTemporalPrediction/"
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
    pre:
      - type: auto
    fail-fast: true

  stage4:
    name: AscendCBuildTest
    jobs:
      # ARM 算子编译测试（build.sh 统一入口）
      JOB_ai4md:
        name: AI4MD_Build_and_Test
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Build_and_Test
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/build.sh \
                -f pr_filelist.txt --test \
                --scope=simulation/AI4MD/
        runs-on: ['self-hosted', 'arch=arm64', 'spec=xlarge']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_ai4pde:
        name: AI4PDE_Build_and_Test
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Build_and_Test
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/build.sh \
                -f pr_filelist.txt --test \
                --scope=simulation/AI4PDE/ \
                --common-dirs="simulation/AI4PDE/pde_common/"
        runs-on: ['self-hosted', 'arch=arm64', 'spec=xlarge']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_prediction:
        name: Prediction_Build_and_Test
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Build_and_Test
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/build.sh \
                -f pr_filelist.txt --test \
                --scope=prediction/ProcessControl/ \
                --common-dirs="prediction/ProcessControl/PIDModelFit/common/ prediction/ProcessControl/TimeSeriesForecast/common/ prediction/ProcessControl/NonTemporalPrediction/"
        runs-on: ['self-hosted', 'arch=arm64', 'spec=xlarge']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_dao:
        name: Material_Property_DAO
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Check_NPU_and_run_DAO_tests
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/build.sh \
                --python simulation/MaterialPropertyPrediction/DAO \
                -f pr_filelist.txt
        runs-on: ['self-hosted', 'arch=arm64', 'spec=xlarge']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
    pre:
      - type: auto
    fail-fast: false

post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
