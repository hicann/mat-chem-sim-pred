name: PR-pipeline_mat-chem-sim-pred

concurrency:
  max: 15
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

# 删除任何一个都可能导致评论 /compile 无法触发流水线，请勿单独删除。
on:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name }}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ vars.OBS_PATH }}/${{ env.MERGE_ID }}"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              allow-unsafe-pr-checkout: true
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
      - type: auto
    fail-fast: true

  stage2:
    name: CodeCheck
    jobs:
      JOB_codecheck:
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
    pre:
      - type: auto
    fail-fast: false

  stage3:
    name: ReferenceTest
    jobs:
      # ---- 自有：PyTorch/Python 单元测试（用 OBS 清单做变更过滤，与社区同源）----
      # pre-commit 已由 stage2 的 codecheck_action.yml 统一处理，此处不重复调用。
      JOB_pytorch:
        name: PyTorch_Reference_Tests
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Check_and_Run
            run: |
              set -euo pipefail
              export PIP_INDEX_URL=https://repo.huaweicloud.com/repository/pypi/simple
              PYTHON_BIN="${PYTHON_BIN:-python3}"
              changed_files="$(cat pr_filelist.txt)"
              if ! printf '%s\n' "$changed_files" | grep -q '^prediction/SmallData/'; then
                echo "No SmallData files changed; GPR tests are skipped."
                exit 0
              fi
              "$PYTHON_BIN" -m pip install --upgrade pip
              "$PYTHON_BIN" - <<'PY'
              import importlib.util
              import subprocess
              import sys

              required = ["numpy", "pytest", "torch"]
              missing = [name for name in required if importlib.util.find_spec(name) is None]
              if missing:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", *missing])
              PY
              "$PYTHON_BIN" -X faulthandler -m pytest prediction/SmallData/test_gpr.py -v --tb=short
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_prediction_reference:
        name: Prediction_Reference_Tests
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Check_and_Run
            run: |
              set -euo pipefail
              export PIP_INDEX_URL=https://repo.huaweicloud.com/repository/pypi/simple
              PYTHON_BIN="${PYTHON_BIN:-python3}"
              changed_files="$(cat pr_filelist.txt)"
              if ! printf '%s\n' "$changed_files" | grep -q '^prediction/ProcessControl/'; then
                echo "No ProcessControl files changed; prediction reference tests are skipped."
                exit 0
              fi
              "$PYTHON_BIN" -m pip install --upgrade pip
              "$PYTHON_BIN" - <<'PY'
              import importlib.util
              import subprocess
              import sys

              required = ["numpy", "pytest", "torch"]
              missing = [name for name in required if importlib.util.find_spec(name) is None]
              if missing:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", *missing])
              PY
              pid_common_changed=false
              timeseries_common_changed=false
              non_temporal_common_changed=false
              printf '%s\n' "$changed_files" | grep -q '^prediction/ProcessControl/PIDModelFit/common/' && pid_common_changed=true || true
              printf '%s\n' "$changed_files" | grep -q '^prediction/ProcessControl/TimeSeriesForecast/common/' && timeseries_common_changed=true || true
              printf '%s\n' "$changed_files" | grep -Eq '^prediction/ProcessControl/NonTemporalPrediction/[^/]+$' && non_temporal_common_changed=true || true
              ran_test=false
              overall_rc=0
              while IFS= read -r test_dir; do
                operator="${test_dir%/tests}"
                run_operator=false
                if printf '%s\n' "$changed_files" | grep -q "^${operator}/"; then
                  run_operator=true
                fi
                case "$operator" in
                  prediction/ProcessControl/PIDModelFit/*)
                    [ "$pid_common_changed" = true ] && run_operator=true
                    ;;
                  prediction/ProcessControl/TimeSeriesForecast/*)
                    [ "$timeseries_common_changed" = true ] && run_operator=true
                    ;;
                  prediction/ProcessControl/NonTemporalPrediction/*)
                    [ "$non_temporal_common_changed" = true ] && run_operator=true
                    ;;
                esac
                if [ "$run_operator" = false ]; then
                  continue
                fi
                ran_test=true
                echo "=== Running reference tests: $operator ==="
                if ! (
                  cd "$operator"
                  "$PYTHON_BIN" -X faulthandler -m pytest tests -v --tb=short
                ); then
                  overall_rc=1
                fi
              done < <(find prediction/ProcessControl/PIDModelFit prediction/ProcessControl/TimeSeriesForecast prediction/ProcessControl/NonTemporalPrediction -type d -name tests -print)
              if [ "$ran_test" = false ]; then
                echo "No prediction operator files changed; reference tests are skipped."
              fi
              exit "$overall_rc"
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
    pre:
      - type: auto
    fail-fast: true

  stage4:
    name: AscendCBuildTest
    jobs:
      # ---- ARM 算子编译测试：checkout 后调 shell 脚本，与 pypto/tilelang 的 ut.sh 模式一致 ----
      JOB_ai4md:
        name: AI4MD_Build_and_Test
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Build_and_Test
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/ascend_build_test.sh loop_fixed "simulation/AI4MD/Lennard_Jones simulation/AI4MD/Dissipative_particle_dynamics simulation/AI4MD/GAFF2 simulation/AI4MD/PME simulation/AI4MD/SHAKE simulation/AI4MD/velocity-verlet"
        runs-on: ['self-hosted', 'arch=arm64', 'spec=xlarge']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_ai4pde:
        name: AI4PDE_Build_and_Test
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Build_and_Test
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/ascend_build_test.sh loop_glob "simulation/AI4PDE/*" "simulation/AI4PDE/pde_common/"
        runs-on: ['self-hosted', 'arch=arm64', 'spec=xlarge']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_prediction:
        name: Prediction_Build_and_Test
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Build_and_Test
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/ascend_build_test.sh loop_glob "prediction/ProcessControl/PIDModelFit/* prediction/ProcessControl/TimeSeriesForecast/* prediction/ProcessControl/NonTemporalPrediction/*" "prediction/ProcessControl/PIDModelFit/common/ prediction/ProcessControl/TimeSeriesForecast/common/ prediction/ProcessControl/NonTemporalPrediction/"
        runs-on: ['self-hosted', 'arch=arm64', 'spec=xlarge']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_dao:
        name: Material_Property_DAO
        steps:
          - name: Checkout_code
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: Download_pr_filelist
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: "${{ env.obs_path }}/pr_filelist.txt"
              path: ${{ steps.process_checkout.outputs.path }}
          - name: Check_NPU_and_run_DAO_tests
            run: |
              bash ${{ steps.process_checkout.outputs.path }}/.gitcode/scripts/ascend_build_test.sh python simulation/MaterialPropertyPrediction/DAO
        runs-on: ['self-hosted', 'arch=arm64', 'spec=xlarge']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
    pre:
      - type: auto
    fail-fast: false

post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master