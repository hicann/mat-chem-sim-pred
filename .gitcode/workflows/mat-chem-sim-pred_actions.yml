              set -euo pipefail
              TARGET_BRANCH="${TARGET_BRANCH:-}"
              if [ -n "$TARGET_BRANCH" ]; then
                git fetch --no-tags --depth=1 origin "$TARGET_BRANCH" || true
              fi
              base_ref=""
              if [ -n "$TARGET_BRANCH" ] && git rev-parse --verify "origin/$TARGET_BRANCH" >/dev/null 2>&1; then
                base_ref="origin/$TARGET_BRANCH"
              elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                base_ref="HEAD^"
              fi
              if [ -n "$base_ref" ]; then
                changed_files="$(git diff --name-only "$base_ref..HEAD")"
              else
                echo "Unable to resolve a diff base; conservatively checking all tracked files."
                changed_files="$(git ls-files)"
              fi
              ran_build=false
              overall_rc=0
              for operator in simulation/AI4MD/PME simulation/AI4MD/SHAKE simulation/AI4MD/velocity-verlet; do
                if ! printf '%s\n' "$changed_files" | grep -q "^${operator}/"; then
                  continue
                fi
                ran_build=true
                echo "=== Building AI4MD operator: $operator ==="
                if ! cmake -S "$operator" -B "$operator/build" -DCMAKE_BUILD_TYPE=Release -DSOC_VERSION=Ascend910B1; then
                  overall_rc=1
                  continue
                fi
                if ! cmake --build "$operator/build" -j"$(nproc)"; then
                  overall_rc=1
                  continue
                fi
                if [ -d "$operator/tests" ] && ! ctest --test-dir "$operator/build" --output-on-failure -j"$(nproc)"; then
                  overall_rc=1
                fi
              done
              if [ "$ran_build" = false ]; then
                echo "No additional AI4MD operator files changed; build is skipped."
              fi
              exit "$overall_rc"
        if: "${{ default() }}"
        runs-on: ascend-runner
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ascend/cann:7.0.RC1-ubuntu22.04-aarch64
